name: Build Android APK & iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  quality-gate:
    name: Typecheck & Offline Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (strict lockfile)
        run: npm ci

      - name: TypeScript strict typecheck
        run: npm run typecheck

      - name: Offline security, parser & RFC 5545 verification
        run: npm run verify

  build-android-apk:
    name: Build Android Release APK
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies (strict lockfile)
        run: npm ci

      - name: Prebuild Android native project via Expo Config Plugin
        run: npx expo prebuild --platform android --clean

      - name: Verify Android zero-retention native code & hardened manifest survived prebuild
        run: |
          grep -q "GdouEphemeralCookieJar" android/app/src/main/java/cn/edu/gdou/schedule/MainApplication.kt
          grep -q "GdouOtaBundle" android/app/src/main/java/cn/edu/gdou/schedule/MainApplication.kt
          grep -q "GdouScheduleWidgetProvider" android/app/src/main/java/cn/edu/gdou/schedule/GdouScheduleWidgetProvider.kt
          grep -q "GdouOngoingNotificationHelper" android/app/src/main/java/cn/edu/gdou/schedule/GdouScheduleWidgetProvider.kt
          grep -q "GdouMediaPickerActivity" android/app/src/main/java/cn/edu/gdou/schedule/GdouMediaPickerActivity.kt
          grep -q "GdouScheduleWidgetProvider" android/app/src/main/AndroidManifest.xml
          grep -q "X-Gdou-Clear-Cookies-After" android/app/src/main/java/cn/edu/gdou/schedule/MainApplication.kt
          grep -q 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'android.intent.action.SET_ALARM' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.SYSTEM_ALERT_WINDOW" tools:node="remove"' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.READ_EXTERNAL_STORAGE" tools:node="remove"' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.WRITE_EXTERNAL_STORAGE" tools:node="remove"' android/app/src/main/AndroidManifest.xml
          grep -q "android.enableMinifyInReleaseBuilds=true" android/gradle.properties
          grep -q "EX_DEV_CLIENT_NETWORK_INSPECTOR=false" android/gradle.properties
          grep -q "GDOU_RELEASE_STORE_FILE" android/app/build.gradle
          node -e '
            const fs = require("fs");
            const gradle = fs.readFileSync("android/app/build.gradle", "utf8");
            const rel = gradle.match(/buildTypes\s*\{[\s\S]*?release\s*\{([\s\S]*?)\n\s{8}\}/);
            if (!rel) { console.error("release buildType not found"); process.exit(1); }
            if (/signingConfig\s+signingConfigs\.debug/.test(rel[1])) {
              console.error("ERROR: release buildType must NEVER reference signingConfigs.debug!");
              process.exit(1);
            }
          '

      - name: Prepare optional release signing keystore from GitHub Secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_STORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/gdou-release.jks"
            echo "GDOU_RELEASE_STORE_FILE=$RUNNER_TEMP/gdou-release.jks" >> "$GITHUB_ENV"
            echo "GDOU_RELEASE_STORE_PASSWORD=$ANDROID_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "GDOU_RELEASE_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "GDOU_RELEASE_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "APK_SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "No release signing secrets configured; building unsigned release APK (never debug.keystore)."
            echo "APK_SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Build Android Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64 --no-daemon
          mkdir -p ../dist
          if [ "$APK_SIGNED" = "true" ]; then
            BUILT_APK="app/build/outputs/apk/release/app-release.apk"
            cp "$BUILT_APK" "../dist/haida-schedule-v${APP_VERSION}-android.apk"
          else
            BUILT_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
            cp "$BUILT_APK" "../dist/haida-schedule-v${APP_VERSION}-android-unsigned.apk"
          fi
          unzip -p "$BUILT_APK" assets/index.android.bundle > "../dist/haida-schedule-v${APP_VERSION}-android-ota.jsbundle"
          ls -lh ../dist

      - name: Upload Android APK & OTA bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: haida-schedule-android-apk
          path: |
            dist/haida-schedule-v*-android*.apk
            dist/haida-schedule-v*-android-ota.jsbundle
          if-no-files-found: error

  build-ios-ipa:
    name: Build iOS Unsigned IPA (Sideloadly / AltStore / TrollStore)
    needs: quality-gate
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode 26+ toolchain (Swift >= 6.2 for Expo SDK 58)
        run: |
          ls -d /Applications/Xcode*.app || true
          LATEST_XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$LATEST_XCODE" ]; then
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          fi
          xcodebuild -version
          swift --version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (strict lockfile)
        run: npm ci

      - name: Prebuild iOS native project via Expo Config Plugin
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Verify iOS zero-retention ephemeral networking survived prebuild
        run: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          SWIFT_FILE=$(find ios -maxdepth 2 -name "GdouEphemeralNetworking.swift" | head -n 1)
          if [ -z "$SWIFT_FILE" ]; then
            echo "ERROR: GdouEphemeralNetworking.swift not generated!"
            exit 1
          fi
          grep -q "GdouEphemeralURLProtocol" "$SWIFT_FILE"
          grep -q "GdouIosAlarmBridge" "$SWIFT_FILE"
          grep -q "GdouIosWidgetBridge" "$SWIFT_FILE"
          grep -q "GdouSharedKeychainStore" "$SWIFT_FILE"
          grep -q "isInWfwAuthPath" "$SWIFT_FILE"
          grep -q "AlarmManager.shared" "$SWIFT_FILE"
          grep -q "GdouOtaBundle" "$SWIFT_FILE"
          grep -q "NSAlarmKitUsageDescription" ios/*/Info.plist
          grep -q "NSSupportsLiveActivities" ios/*/Info.plist
          grep -q "GdouScheduleWidgetBundle" ios/GdouScheduleWidgetExtension/GdouScheduleWidget.swift
          grep -q "containerBackground(for: .widget)" ios/GdouScheduleWidgetExtension/GdouScheduleWidget.swift
          grep -q "GdouWidgetGroupDiscovery" ios/GdouScheduleWidgetExtension/GdouScheduleWidget.swift
          grep -q "GdouWidgetKeychainStore" ios/GdouScheduleWidgetExtension/GdouScheduleWidget.swift
          grep -q "parentAppBundleURL" ios/GdouScheduleWidgetExtension/GdouScheduleWidget.swift
          grep -q "upcomingDays" ios/GdouScheduleWidgetExtension/GdouScheduleWidget.swift
          grep -q "<string>XPC!</string>" ios/GdouScheduleWidgetExtension/Info.plist
          grep -q "SKStoreProductViewController" "$SWIFT_FILE"
          grep -q "ExpoFetchCustomExtension.setCustomURLSessionConfigurationProvider" "$SWIFT_FILE"
          grep -q "readBodyStream" "$SWIFT_FILE"
          grep -q "if didRedirect {" "$SWIFT_FILE"
          grep -q "URLSessionConfiguration.ephemeral" "$SWIFT_FILE"
          grep -q "X-Gdou-Clear-Cookies-After" "$SWIFT_FILE"
          grep -q "GdouEphemeralNetworking.install()" ios/*/AppDelegate.swift
          grep -q "GdouOtaBundle.resolveBundleURL()" ios/*/AppDelegate.swift
          grep -q "RCTHTTPRequestHandler.h" ios/*/*-Bridging-Header.h
          grep -q "GdouEphemeralNetworking.swift" ios/*.xcodeproj/project.pbxproj
          grep -q "SWIFT_OBJC_BRIDGING_HEADER" ios/*.xcodeproj/project.pbxproj
          node -e '
            const fs = require("fs");
            const path = require("path");
            const xcodeproj = fs.readdirSync("ios").find((d) => d.endsWith(".xcodeproj"));
            const pbx = fs.readFileSync(path.join("ios", xcodeproj, "project.pbxproj"), "utf8");
            const phases = pbx.match(/\/\* Begin PBXSourcesBuildPhase section \*\/[\s\S]*?\/\* End PBXSourcesBuildPhase section \*\//);
            for (const f of ["GdouEphemeralNetworking.swift", "GdouScheduleActivityAttributes.swift", "GdouScheduleWidget.swift", "GdouWidgetActivityAttributes.swift"]) {
              if (!phases || !phases[0].includes(f)) {
                console.error("ERROR: " + f + " is NOT compiled in PBXSourcesBuildPhase!");
                process.exit(1);
              }
            }
            if (!pbx.includes("PBXTargetDependency")) {
              console.error("ERROR: Missing PBXTargetDependency for GdouScheduleWidgetExtension!");
              process.exit(1);
            }
            if (pbx.includes("= undefined;")) {
              console.error("ERROR: Found undefined property in project.pbxproj!");
              process.exit(1);
            }
          '

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build iOS Release App (Unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME_FILE=$(find *.xcodeproj/xcshareddata/xcschemes -maxdepth 1 -name "*.xcscheme" 2>/dev/null | head -n 1)
          if [ -n "$SCHEME_FILE" ]; then
            SCHEME=$(basename "$SCHEME_FILE" .xcscheme)
          else
            SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          fi
          echo "Building workspace=$WORKSPACE scheme=$SCHEME"
          mkdir -p build
          if ! xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build/xcodebuild.log; then
            grep -E "(^.*error:|fatal error:|\*\* BUILD FAILED \*\*)" build/xcodebuild.log | tail -n 30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Package .app into installable unsigned .ipa (ad-hoc signed for iOS 18 re-signing)
        working-directory: ios
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app bundle not found"
            exit 1
          fi
          # Bottom-up ad-hoc sign all embedded frameworks/dylibs and app extensions (.appex) first, then the main .app bundle,
          # embedding App Group entitlements so TrollStore / SideStore / AltStore / Feather / ESign / Sideloadly
          # preserve WidgetKit App Group containers cleanly on iOS 18+ / iOS 26.
          if [ -d "$APP_PATH/Frameworks" ]; then
            find "$APP_PATH/Frameworks" -maxdepth 1 \( -name "*.framework" -o -name "*.dylib" \) -print0 | while IFS= read -r -d '' fw; do
              echo "Ad-hoc signing embedded binary: $fw"
              codesign --force --sign - --timestamp=none "$fw"
            done
          fi
          WIDGET_APPEX="$APP_PATH/PlugIns/GdouScheduleWidgetExtension.appex"
          if [ ! -d "$WIDGET_APPEX" ]; then
            echo "ERROR: Embedded GdouScheduleWidgetExtension.appex missing from $APP_PATH/PlugIns!"
            exit 1
          fi
          /usr/libexec/PlistBuddy -c "Print :CFBundlePackageType" "$WIDGET_APPEX/Info.plist" | grep -qx "XPC!"
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$WIDGET_APPEX/Info.plist" | grep -qx "com.apple.widgetkit-extension"
          WIDGET_ENTITLEMENTS="GdouScheduleWidgetExtension/GdouScheduleWidgetExtension.entitlements"
          if [ -d "$APP_PATH/PlugIns" ]; then
            find "$APP_PATH/PlugIns" -maxdepth 1 -name "*.appex" -print0 | while IFS= read -r -d '' ext; do
              echo "Ad-hoc signing embedded app extension with entitlements: $ext"
              if [ -f "$WIDGET_ENTITLEMENTS" ]; then
                codesign --force --sign - --timestamp=none --entitlements "$WIDGET_ENTITLEMENTS" "$ext"
              else
                codesign --force --sign - --timestamp=none "$ext"
              fi
            done
          fi
          MAIN_ENTITLEMENTS=$(find . -maxdepth 2 -name "*.entitlements" ! -path "./GdouScheduleWidgetExtension/*" | head -n 1 || true)
          if [ -n "$MAIN_ENTITLEMENTS" ] && [ -f "$MAIN_ENTITLEMENTS" ]; then
            echo "Ad-hoc signing main app with entitlements: $MAIN_ENTITLEMENTS"
            codesign --force --sign - --timestamp=none --entitlements "$MAIN_ENTITLEMENTS" "$APP_PATH"
          else
            codesign --force --sign - --timestamp=none "$APP_PATH"
          fi
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -d --entitlements :- "$APP_PATH" 2>&1 | grep -q "com.apple.security.application-groups"
          codesign -d --entitlements :- "$WIDGET_APPEX" 2>&1 | grep -q "com.apple.security.application-groups"
          OUT_NAME="haida-schedule-v${APP_VERSION}-ios-unsigned.ipa"
          rm -rf Payload "$OUT_NAME"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry "$OUT_NAME" Payload
          mkdir -p ../dist
          cp "$OUT_NAME" "../dist/$OUT_NAME"
          if [ -f "$APP_PATH/main.jsbundle" ]; then
            cp "$APP_PATH/main.jsbundle" "../dist/haida-schedule-v${APP_VERSION}-ios-ota.jsbundle"
          fi
          ls -lh ../dist

      - name: Upload iOS IPA & OTA bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: haida-schedule-ios-unsigned-ipa
          path: |
            dist/haida-schedule-v*-ios-unsigned.ipa
            dist/haida-schedule-v*-ios-ota.jsbundle
          if-no-files-found: error

  generate-ota-manifest:
    name: Generate Verified OTA Manifest (SHA-256 + Runtime ABI)
    needs: [ build-android-apk, build-ios-ipa ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Android OTA bundle
        uses: actions/download-artifact@v4
        with:
          name: haida-schedule-android-apk
          path: dist

      - name: Download iOS OTA bundle
        uses: actions/download-artifact@v4
        with:
          name: haida-schedule-ios-unsigned-ipa
          path: dist

      - name: Build haida-schedule-vX.Y.Z-ota-manifest.json
        run: |
          node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const appJson = require("./app.json");
            const version = appJson.expo.version;
            const otaSrc = fs.readFileSync("src/services/otaUpdateService.ts", "utf8");
            const rtMatch = otaSrc.match(/NATIVE_OTA_RUNTIME_VERSION\s*=\s*(\d+)/);
            const minNativeRuntimeVersion = rtMatch ? Number(rtMatch[1]) : 1;
            const iosName = `haida-schedule-v${version}-ios-ota.jsbundle`;
            const androidName = `haida-schedule-v${version}-android-ota.jsbundle`;
            const hashAndSize = (fname) => {
              const p = `dist/${fname}`;
              if (!fs.existsSync(p)) return null;
              const buf = fs.readFileSync(p);
              return {
                sha256: crypto.createHash("sha256").update(buf).digest("hex"),
                size: buf.length,
              };
            };
            const iosInfo = hashAndSize(iosName);
            const androidInfo = hashAndSize(androidName);
            const manifest = {
              version,
              minNativeRuntimeVersion,
              publishedAt: new Date().toISOString(),
              ...(iosInfo
                ? {
                    iosBundleName: iosName,
                    iosSha256: iosInfo.sha256,
                    iosSize: iosInfo.size,
                    ios: { fileName: iosName, sha256: iosInfo.sha256, size: iosInfo.size },
                  }
                : {}),
              ...(androidInfo
                ? {
                    androidBundleName: androidName,
                    androidSha256: androidInfo.sha256,
                    androidSize: androidInfo.size,
                    android: { fileName: androidName, sha256: androidInfo.sha256, size: androidInfo.size },
                  }
                : {}),
            };
            const outPath = `dist/haida-schedule-v${version}-ota-manifest.json`;
            fs.writeFileSync(outPath, JSON.stringify(manifest, null, 2) + "\n", "utf8");
            console.log("Generated", outPath, manifest);
          '

      - name: Upload OTA manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: haida-schedule-ota-manifest
          path: dist/haida-schedule-v*-ota-manifest.json
          if-no-files-found: error
